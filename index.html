<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  font-size: 14vw;
  line-height: 0.9;
  cursor: pointer;
  z-index: 10;
}

.circle-img {
  position: fixed;
  top: -160px;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
</div>

<script>
const logo = document.getElementById("logoText");
const IMG = "bksscircle.png";

let placed = [];

function isOverlapping(x, y, r) {
  for (const p of placed) {
    const dx = x - p.x;
    const dy = y - p.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < r + p.r + 2) {
      return true;
    }
  }
  return false;
}

function findSpot(size) {
  const r = size / 2;
  const gap = 2;

  for (let y = window.innerHeight - r; y > r; y -= r * 0.45) {
    for (let attempt = 0; attempt < 80; attempt++) {
      const x = r + Math.random() * (window.innerWidth - size);

      if (!isOverlapping(x, y, r + gap)) {
        return { x, y };
      }
    }
  }

  return null;
}

logo.onclick = () => {
  logo.style.pointerEvents = "none";

  let count = 0;
  const total = 300;

  const drop = setInterval(() => {
    let size;

    if (count < 70) {
      size = 18 + Math.random() * 20;
    } else if (count < 170) {
      size = 35 + Math.random() * 35;
    } else {
      size = 65 + Math.random() * 70;
    }

    const spot = findSpot(size);

    if (!spot) {
      clearInterval(drop);
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = "circle-img";

    img.style.width = size + "px";
    img.style.height = size + "px";

    img.style.left = (spot.x - size / 2) + "px";
    img.style.setProperty("--stopY", (spot.y - size / 2) + "px");

    img.style.animationDuration = 1.2 + Math.random() * 1.8 + "s";

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= total) {
      clearInterval(drop);
    }
  }, 30);
};
</script>

</body>
</html>
