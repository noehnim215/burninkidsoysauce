<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  font-size: 12vw;
  line-height: 0.9;
  cursor: pointer;
  transform: scaleX(1.08);
}

.falling-img {
  position: fixed;
  top: -200px;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
    transform: rotate(var(--rotate));
  }
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
</div>

<script>
const logo = document.getElementById("logoText");
const IMG = "first.png";

logo.onclick = () => {
  logo.style.pointerEvents = "none";

  let count = 0;
  const total = 170;
  const floor = window.innerHeight - 70;

  const drop = setInterval(() => {
    const img = document.createElement("img");
    img.src = IMG;
    img.className = "falling-img";

    let size;

    if (count < 35) {
      size = 18 + Math.random() * 22;
    } else if (count < 95) {
      size = 35 + Math.random() * 55;
    } else {
      size = 65 + Math.random() * 95;
    }

    const left = Math.random() * window.innerWidth;
    const pileHeight = Math.random() * 180;
    const stopY = floor - pileHeight;

    img.style.left = left + "px";
    img.style.width = size + "px";
    img.style.setProperty("--stopY", stopY + "px");
    img.style.setProperty("--rotate", (Math.random() * 720 - 360) + "deg");
    img.style.animationDuration = 1.4 + Math.random() * 2.2 + "s";

    document.body.appendChild(img);

    count++;

    if (count >= total) {
      clearInterval(drop);
    }
  }, 45);
};
</script>

</body>
</html>
