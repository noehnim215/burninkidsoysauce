<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
}

/* 날짜 / 시간 폰트 크기 */
#infoText {
  margin-top: 12px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 24px;
  line-height: 1.2;
  text-align: center;
}

/* Cam / Song 폰트 크기 여기서 수정 */
.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 24px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

#changeBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: none;
  cursor: pointer;
  font-family: "ta-marugo-gf-03", sans-serif;
  border-bottom: 1px solid black;
  z-index: 999;
}

.circle-img {
  position: fixed;
  top: -200px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 10;
}

.circle-pop {
  position: fixed;
  pointer-events: none;
  z-index: 10;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

#camCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: none;
  transform: scaleX(-1);
  z-index: 1;
}

video {
  display: none;
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
  <div id="infoText"></div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<div id="changeBtn">Change</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio"></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const changeBtn = document.getElementById("changeBtn");
const infoText = document.getElementById("infoText");

const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

/* =========================
   CAM SETTINGS
========================= */
const CAM_NOISE = 60;
const CAM_THRESHOLD = 110;
const CAM_BLUR = 0.5;
const CAM_MIRROR = true;
const CAM_BG_COLOR = [255,255,255];
const GREEN_COLOR = [81,255,14];
const BLACK_COLOR = [0,0,0];

let camRunning = false;
let INK_COLOR = BLACK_COLOR;
let isGreen = false;
let placed = [];

/* 🔥 추가된 부분 */
let currentFacingMode = "user";
let currentStream = null;

/* LOGO RANDOM SIZE */
function setRandomLogoSize(){
  const chance = Math.random();
  let size;

  if (chance < 0.78) size = 6 + Math.random() * 114;
  else if (chance < 0.95) size = 120 + Math.random() * 180;
  else size = 300 + Math.random() * 212;

  logo.style.fontSize = size + "pt";
}
setRandomLogoSize();

/* DATE */
function updateInfoText(){
  const now = new Date();
  const date = now.toLocaleDateString();
  const time = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
  infoText.innerHTML = date + " " + time;
}
updateInfoText();
setInterval(updateInfoText, 1000);

/* CHANGE */
changeBtn.onclick = () => {
  isGreen = !isGreen;
  INK_COLOR = isGreen ? GREEN_COLOR : BLACK_COLOR;
};

/* 🔥 카메라 시작 함수 (추가) */
async function startCamera(facingMode) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });

  currentStream = stream;
  video.srcObject = stream;

  canvas.style.display = "block";
  canvas.style.filter = "blur(" + CAM_BLUR + "px)";
  canvas.style.transform = CAM_MIRROR ? "scaleX(-1)" : "scaleX(1)";
  changeBtn.style.display = "block";

  video.onloadedmetadata = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    camRunning = true;
    processFrame();
  };
}

/* 🔥 Cam 버튼 변경 */
camBtn.onclick = () => {
  startCamera(currentFacingMode);
};

/* 🔥 더블탭 전환 */
canvas.addEventListener("dblclick", () => {
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(currentFacingMode);
});

window.addEventListener("resize", () => {
  if (camRunning) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});

function drawVideoCover() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(cw / vw, ch / vh);
  const nw = vw * scale;
  const nh = vh * scale;
  const dx = (cw - nw) / 2;
  const dy = (ch - nh) / 2;

  ctx.drawImage(video, dx, dy, nw, nh);
}

function processFrame(){
  if(!camRunning) return;

  drawVideoCover();

  let frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  let data = frame.data;

  for(let i=0;i<data.length;i+=4){
    let gray = (data[i]+data[i+1]+data[i+2])/3;
    gray += (Math.random()-0.5) * CAM_NOISE;
    let v = gray < CAM_THRESHOLD ? 0 : 255;

    if (v === 0) {
      data[i] = INK_COLOR[0];
      data[i+1] = INK_COLOR[1];
      data[i+2] = INK_COLOR[2];
    } else {
      data[i] = CAM_BG_COLOR[0];
      data[i+1] = CAM_BG_COLOR[1];
      data[i+2] = CAM_BG_COLOR[2];
    }
  }

  ctx.putImageData(frame,0,0);
  requestAnimationFrame(processFrame);
}
</script>

</body>
</html>
