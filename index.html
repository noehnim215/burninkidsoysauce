<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 5;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
  color: black;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

.circle-img {
  position: fixed;
  top: -260px;
  pointer-events: none;
  animation-name: fall;
  animation-fill-mode: forwards;
  z-index: 3;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

#camCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  display: none;

  /* 🔥 좌우 반전 + 블러 */
  transform: scaleX(-1);
  filter: blur(0.5px);
}

video { display:none; }
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio" loop></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

/* 🔥 여기만 수정하면 됨 */
const CAM_NOISE = 35;       // 노이즈 강도 (10~60 추천)
const CAM_THRESHOLD = 10;  // 검정 기준 (높을수록 검정 많음)
const CAM_BLUR = 0.5;       // blur (CSS에서 적용)

let prevGray = null;
let stillCounter = 0;
let echoData = null;

logo.style.fontSize = (6 + Math.random()*120) + "pt";

camBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  canvas.style.display = "block";

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    echoData = new Float32Array(canvas.width * canvas.height);
    processFrame();
  };
};

songBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "audio/*";

  input.onchange = e => {
    audio.src = URL.createObjectURL(e.target.files[0]);
    audio.play();
  };

  input.click();
};

function processFrame() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  let frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  let data = frame.data;
  let w = canvas.width;
  let h = canvas.height;

  let grayArr = new Uint8Array(w*h);
  let output = new Uint8Array(w*h);

  let diffSum = 0;

  for (let i=0;i<w*h;i++){
    let r = data[i*4];
    let g = data[i*4+1];
    let b = data[i*4+2];

    let gray = 0.299*r + 0.587*g + 0.114*b;

    /* 🔥 노이즈 */
    gray += (Math.random()-0.5) * CAM_NOISE;

    gray = Math.max(0, Math.min(255, gray));
    grayArr[i] = gray;

    if(prevGray){
      diffSum += Math.abs(gray - prevGray[i]);
    }

    /* 🔥 threshold */
    output[i] = gray < CAM_THRESHOLD ? 0 : 255;
  }

  if(prevGray){
    let diffMean = diffSum/(w*h);
    stillCounter = diffMean < 2 ? stillCounter+1 : 0;
  }

  prevGray = grayArr;

  /* 🔥 잔상 */
  for (let i=0;i<w*h;i++){
    let dark = output[i]<128 ? 1 : 0;
    echoData[i] = echoData[i]*0.88 + dark*0.12;

    if (echoData[i] > 0.25){
      output[i] = 0;
    }
  }

  for (let i=0;i<w*h;i++){
    let ink = output[i]<128;
    data[i*4] = ink?0:255;
    data[i*4+1] = ink?0:255;
    data[i*4+2] = ink?0:255;
  }

  ctx.putImageData(frame,0,0);
  requestAnimationFrame(processFrame);
}
</script>

</body>
</html>
