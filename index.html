<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<!-- Adobe Font 그대로 -->
<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

/* 텍스트 화면 꽉 채우기 */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  font-size: 14vw;
  line-height: 0.9;
  cursor: pointer;
}

/* 원 */
.circle {
  position: fixed;
  top: -100px;
  border-radius: 50%;
  background: black;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
</div>

<script>
const logo = document.getElementById("logoText");

logo.onclick = () => {

  logo.style.pointerEvents = "none";

  let count = 0;
  const total = 260;
  const floor = window.innerHeight;

  const drop = setInterval(() => {

    const circle = document.createElement("div");
    circle.className = "circle";

    let size;

    // 처음 작게 → 점점 크게
    if (count < 60) {
      size = 6 + Math.random() * 14;
    } else if (count < 150) {
      size = 14 + Math.random() * 26;
    } else {
      size = 28 + Math.random() * 60;
    }

    const left = Math.random() * window.innerWidth;

    // 쌓이는 느낌 (랜덤 높이 누적)
    const pile = Math.random() * 250;
    const stopY = floor - pile;

    circle.style.width = size + "px";
    circle.style.height = size + "px";
    circle.style.left = left + "px";
    circle.style.setProperty("--stopY", stopY + "px");

    circle.style.animationDuration = 1.2 + Math.random() * 2 + "s";

    document.body.appendChild(circle);

    count++;

    if (count >= total) {
      clearInterval(drop);
    }

  }, 25);
};
</script>

</body>
</html>
