<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;

};

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

/* 🔥 모든 텍스트 효과 제거 */
* {
  -webkit-text-stroke: 0px !important;
  text-stroke: 0px !important;
  text-shadow: none !important;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
}

#infoText {
  margin-top: 10px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 14px;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

/* 모바일 확대 */
@media (max-width: 768px) {
  .controls {
    font-size: 23px;
  }
}

#changeBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: none;
  cursor: pointer;
  font-family: "ta-marugo-gf-03", sans-serif;
  border-bottom: 1px solid black;
  z-index: 999;
}

.circle-img {
  position: fixed;
  top: -200px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

#camCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: none;
  transform: scaleX(-1);
  z-index: 1;
}

video {
  display: none;
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
  <div id="infoText"></div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<div id="changeBtn">Change</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio"></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const changeBtn = document.getElementById("changeBtn");
const infoText = document.getElementById("infoText");

const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

/* CAM SETTINGS */
const CAM_NOISE = 100;
const CAM_THRESHOLD = 120;
const CAM_BLUR = 0.7;
const CAM_MIRROR = true;

const GREEN_COLOR = [81,255,14];
const BLACK_COLOR = [0,0,0];

let camRunning = false;
let INK_COLOR = BLACK_COLOR;
let isGreen = false;
let placed = [];

/* LOGO SIZE */
function setRandomLogoSize(){
  const chance = Math.random();
  let size;

  if (chance < 0.78) size = 6 + Math.random() * 114;
  else if (chance < 0.95) size = 120 + Math.random() * 180;
  else size = 300 + Math.random() * 212;

  logo.style.fontSize = size + "pt";
}
setRandomLogoSize();

/* DATE + TIME */
function updateInfoText(){
  const now = new Date();
  infoText.innerHTML = now.toLocaleDateString() + " " + now.toLocaleTimeString();
}
updateInfoText();
setInterval(updateInfoText,1000);

/* CHANGE COLOR */
changeBtn.onclick = ()=>{
  isGreen=!isGreen;
  INK_COLOR = isGreen ? GREEN_COLOR : BLACK_COLOR;
};

/* CAM */
camBtn.onclick = async ()=>{
  const stream = await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject = stream;

  canvas.style.display="block";
  canvas.style.filter = `blur(${CAM_BLUR}px)`;
  canvas.style.transform = CAM_MIRROR ? "scaleX(-1)" : "scaleX(1)";
  changeBtn.style.display="block";

  video.onloadedmetadata = ()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    camRunning=true;
    processFrame();
  };
};

function processFrame(){
  if(!camRunning) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let frame=ctx.getImageData(0,0,canvas.width,canvas.height);
  let data=frame.data;

  for(let i=0;i<data.length;i+=4){
    let gray=(data[i]+data[i+1]+data[i+2])/3;
    gray+=(Math.random()-0.5)*CAM_NOISE;
    let v=gray<CAM_THRESHOLD?0:255;

    if(v===0){
      data[i]=INK_COLOR[0];
      data[i+1]=INK_COLOR[1];
      data[i+2]=INK_COLOR[2];
    } else {
      data[i]=255;
      data[i+1]=255;
      data[i+2]=255;
    }
  }

  ctx.putImageData(frame,0,0);
  requestAnimationFrame(processFrame);
}

/* CIRCLES */
function isOverlap(x,y,r){
  for(let p of placed){
    let dx=x-p.x;
    let dy=y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<r+p.r) return true;
  }
  return false;
}

function findSpot(size){
  let r=size/2;

  for(let y=window.innerHeight-r;y>r;y-=Math.max(2,r*0.25)){
    for(let i=0;i<500;i++){
      let x=r+Math.random()*(window.innerWidth-size);
      if(!isOverlap(x,y,r)) return {x,y};
    }
  }
  return null;
}

logo.onclick=()=>{
  let count=0;

  const drop=setInterval(()=>{
    let size=10+Math.random()*80;

    let spot=findSpot(size);
    if(!spot){clearInterval(drop);return;}

    let img=document.createElement("img");
    img.src=IMG;
    img.className="circle-img";

    img.style.width=size+"px";
    img.style.height=size+"px";
    img.style.left=(spot.x-size/2)+"px";
    img.style.setProperty("--stopY",(spot.y-size/2)+"px");

    document.body.appendChild(img);

    placed.push({x:spot.x,y:spot.y,r:size/2});

    if(++count>800) clearInterval(drop);

  },10);
};
</script>

</body>
</html>
