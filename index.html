<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>

kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);

};
s.parentNode.insertBefore(tk,s)
})(document);

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

#changeBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: none;
  cursor: pointer;
  font-family: "ta-marugo-gf-03";
  border-bottom: 1px solid black;
  z-index: 999;
}

.circle-img {
  position: fixed;
  top: -200px;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

#camCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: none;
  transform: scaleX(-1);
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<div id="changeBtn">Change</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio"></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const changeBtn = document.getElementById("changeBtn");

const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

let camRunning = false;
let INK_COLOR = [0,0,0];
let isGreen = false;
let placed = [];

/* LOGO SIZE */
function setRandomLogoSize(){
  let size = Math.random()*200+40;
  logo.style.fontSize = size + "pt";
}
setRandomLogoSize();

/* CHANGE COLOR */
changeBtn.onclick = () => {
  isGreen = !isGreen;
  INK_COLOR = isGreen ? [81,255,14] : [0,0,0];
};

/* CAM */
camBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  canvas.style.display = "block";
  changeBtn.style.display = "block";

  video.onloadedmetadata = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    camRunning = true;
    processFrame();
  };
};

function processFrame(){
  if(!camRunning) return;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  let frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  let data = frame.data;

  for(let i=0;i<data.length;i+=4){
    let gray = (data[i]+data[i+1]+data[i+2])/3;
    gray += (Math.random()-0.5)*60;
    let v = gray < 110 ? 0 : 255;

    data[i]   = v ? 255 : INK_COLOR[0];
    data[i+1] = v ? 255 : INK_COLOR[1];
    data[i+2] = v ? 255 : INK_COLOR[2];
  }

  ctx.putImageData(frame,0,0);
  requestAnimationFrame(processFrame);
}

/* SONG */
songBtn.onclick = () => {
  document.getElementById("intro").style.display = "none";

  const wrap = document.createElement("div");

  wrap.style.position = "fixed";
  wrap.style.inset = "0";
  wrap.style.display = "flex";
  wrap.style.alignItems = "center";
  wrap.style.justifyContent = "center";
  wrap.style.gap = "70px";
  wrap.style.fontFamily = '"ta-marugo-gf-03"';
  wrap.style.zIndex = "100";

  wrap.innerHTML = `
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>

    <img src="./again1.png" style="
      width:360px;
      height:360px;
      object-fit:cover;
      animation: spin 20s linear infinite;
    ">

    <div id="songList" style="font-size:28px;line-height:1.6;">
      <div data="2000.mp3">2000</div>
      <div data="wiimydadgotmeforchristmas.mp3">wiimydadgotmeforchristmas</div>
      <div data="ps2iplayedwithmybrother.mp3">ps2iplayedwithmybrother</div>
      <div data="girl.mp3">girl</div>
      <div data="2ear.mp3">2ear</div>
      <div data="eolssu.mp3">eolssu</div>
      <div data="dance.mp3">dance</div>
      <div data="how sweet it is.mp3">how sweet it is</div>
      <div data="get up.mp3">get up</div>
      <div data="sierra.mp3">sierra</div>
      <div data="friends.mp3">friends</div>
      <div data="emptyyourmind.mp3">emptyyourmind</div>
      <div data="circle.mp3">circle</div>
    </div>
  `;

  document.body.appendChild(wrap);

  const items = wrap.querySelectorAll("#songList div");

  items.forEach(el=>{
    el.onclick=()=>{
      audio.src = "./" + el.getAttribute("data");
      audio.play();
      items.forEach(i=>i.style.color="black");
      el.style.color="#51ff0e";
    }
  });
};

/* CIRCLES */
function isOverlap(x,y,r){
  for(let p of placed){
    let dx=x-p.x;
    let dy=y-p.y;
    if(Math.sqrt(dx*dx+dy*dy) < r+p.r) return true;
  }
  return false;
}

function findSpot(size){
  let r=size/2;

  for(let y=window.innerHeight-r;y>r;y-=Math.max(2,r*0.3)){
    for(let i=0;i<300;i++){
      let x=r+Math.random()*(window.innerWidth-size);
      if(!isOverlap(x,y,r)) return {x,y};
    }
  }
  return null;
}

logo.onclick = ()=>{
  let count=0;

  const drop=setInterval(()=>{

    let size;
    let c=Math.random();

    if(c<0.7) size=10+Math.random()*30;
    else if(c<0.95) size=40+Math.random()*80;
    else size=120+Math.random()*200;

    let spot=findSpot(size);
    if(!spot){clearInterval(drop);return;}

    let img=document.createElement("img");
    img.src=IMG;
    img.className="circle-img";

    img.style.width=size+"px";
    img.style.height=size+"px";
    img.style.left=(spot.x-size/2)+"px";
    img.style.setProperty("--stopY",(spot.y-size/2)+"px");
    img.style.animationDuration=0.6+Math.random()*2+"s";

    document.body.appendChild(img);
    placed.push({x:spot.x,y:spot.y,r:size/2});

    if(++count>1200) clearInterval(drop);

  },15);
};
</script>

</body>
</html>
