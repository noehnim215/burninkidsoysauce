<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>

var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  color: black;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

.circle-img {
  position: fixed;
  top: -260px;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

video {
  position: fixed;
  inset: 0;
  object-fit: cover;
  z-index: -1;
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>
<audio id="audio" loop></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const video = document.getElementById("video");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

let placed = [];

/* 로고 랜덤 크기
   대부분 6pt ~ 120pt
   가끔 120pt ~ 300pt
   아주 가끔만 300pt 이상 */
function setRandomLogoSize() {
  const chance = Math.random();
  let size;

  if (chance < 0.78) {
    size = 6 + Math.random() * 114;       // 6~120pt 위주
  } else if (chance < 0.95) {
    size = 120 + Math.random() * 180;     // 120~300pt 가끔
  } else {
    size = 300 + Math.random() * 212;     // 300~512pt 아주 가끔
  }

  logo.style.fontSize = size + "pt";
}

setRandomLogoSize();

/* Cam */
camBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
};

/* Song */
songBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "audio/*";

  input.onchange = (e) => {
    const file = e.target.files[0];
    audio.src = URL.createObjectURL(file);
    audio.play();
  };

  input.click();
};

/* 겹침 체크 */
function isOverlapping(x, y, r) {
  for (const p of placed) {
    const dx = x - p.x;
    const dy = y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < r + p.r + 3) return true;
  }
  return false;
}

/* 자리 찾기 */
function findSpot(size) {
  const r = size / 2;

  for (let y = window.innerHeight - r; y > r; y -= Math.max(4, r * 0.45)) {
    for (let i = 0; i < 180; i++) {
      const x = r + Math.random() * (window.innerWidth - size);

      if (!isOverlapping(x, y, r)) {
        return { x, y };
      }
    }
  }
  return null;
}

/* 패턴 랜덤 선택 */
function choosePattern() {
  const patterns = [
    {
      name: "manySmall",
      total: 520,
      delay: 12,
      size: () => 8 + Math.random() * 22
    },
    {
      name: "mixed",
      total: 360,
      delay: 18,
      size: () => {
        const c = Math.random();
        if (c < 0.55) return 12 + Math.random() * 25;
        if (c < 0.88) return 35 + Math.random() * 55;
        return 90 + Math.random() * 90;
      }
    },
    {
      name: "bigHeavy",
      total: 260,
      delay: 24,
      size: () => {
        const c = Math.random();
        if (c < 0.35) return 18 + Math.random() * 28;
        if (c < 0.75) return 50 + Math.random() * 70;
        return 110 + Math.random() * 130;
      }
    },
    {
      name: "tinyRain",
      total: 700,
      delay: 8,
      size: () => 5 + Math.random() * 16
    }
  ];

  return patterns[Math.floor(Math.random() * patterns.length)];
}

/* 클릭 → 원 쌓임 */
logo.onclick = () => {
  logo.style.pointerEvents = "none";

  const pattern = choosePattern();

  let count = 0;
  let hasHugeOne = Math.random() < 0.1; // 10번 중 1번 큰 원 하나
  let hugePlaced = false;

  const drop = setInterval(() => {
    let size;

    if (hasHugeOne && !hugePlaced && count > 20) {
      size = Math.min(window.innerWidth, window.innerHeight) * (0.45 + Math.random() * 0.2);
      hugePlaced = true;
    } else {
      size = pattern.size();
    }

    const spot = findSpot(size);

    if (!spot) {
      clearInterval(drop);
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = "circle-img";

    img.style.width = size + "px";
    img.style.height = size + "px";
    img.style.left = (spot.x - size / 2) + "px";
    img.style.setProperty("--stopY", (spot.y - size / 2) + "px");
    img.style.animationDuration = 0.8 + Math.random() * 2.4 + "s";

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= pattern.total) {
      clearInterval(drop);
    }

  }, pattern.delay);
};
</script>

</body>
</html>
