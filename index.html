<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  color: black;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
  z-index: 30;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

.circle-img {
  position: fixed;
  top: -260px;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
  z-index: 15;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

video {
  display: none;
}

#camCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  display: none;
  pointer-events: none;
  transform: scaleX(-1);
  filter: blur(0.5px);
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
    <span id="greenBtn" style="display:none;">#51ff0e</span>
    <span id="blackBtn" style="display:none;">Black</span>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio" loop></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const greenBtn = document.getElementById("greenBtn");
const blackBtn = document.getElementById("blackBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

const CAM_NOISE = 35;
const CAM_THRESHOLD = 120;
const CAM_BLUR = 0.5;

let INK_COLOR = [0, 0, 0];

let placed = [];
let camRunning = false;
let prevGray = null;
let stillCounter = 0;

function setRandomLogoSize() {
  const chance = Math.random();
  let size;

  if (chance < 0.78) {
    size = 6 + Math.random() * 114;
  } else if (chance < 0.95) {
    size = 120 + Math.random() * 180;
  } else {
    size = 300 + Math.random() * 212;
  }

  logo.style.fontSize = size + "pt";
}

setRandomLogoSize();

greenBtn.onclick = () => {
  INK_COLOR = [81, 255, 14];
};

blackBtn.onclick = () => {
  INK_COLOR = [0, 0, 0];
};

camBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  canvas.style.display = "block";
  canvas.style.pointerEvents = "none";
  canvas.style.filter = "blur(" + CAM_BLUR + "px)";

  greenBtn.style.display = "inline";
  blackBtn.style.display = "inline";

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    camRunning = true;
    processFrame();
  };
};

songBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "audio/*";

  input.onchange = (e) => {
    const file = e.target.files[0];
    audio.src = URL.createObjectURL(file);
    audio.play();
  };

  input.click();
};

function processFrame() {
  if (!camRunning) return;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let data = frame.data;
  let w = canvas.width;
  let h = canvas.height;

  let grayArr = new Uint8Array(w * h);
  let output = new Uint8Array(w * h);
  let diffSum = 0;

  for (let i = 0; i < w * h; i++) {
    let r = data[i * 4];
    let g = data[i * 4 + 1];
    let b = data[i * 4 + 2];

    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
    gray += (Math.random() - 0.5) * CAM_NOISE;
    gray = Math.max(0, Math.min(255, gray));

    grayArr[i] = gray;

    if (prevGray) {
      diffSum += Math.abs(gray - prevGray[i]);
    }

    output[i] = gray < CAM_THRESHOLD ? 0 : 255;
  }

  if (prevGray) {
    const diffMean = diffSum / (w * h);
    stillCounter = diffMean < 2 ? stillCounter + 1 : 0;
  }

  prevGray = grayArr;

  if (stillCounter > 8) {
    bleed(output, w, h);
  }

  for (let i = 0; i < w * h; i++) {
    const isInk = output[i] < 128;

    data[i * 4] = isInk ? INK_COLOR[0] : 255;
    data[i * 4 + 1] = isInk ? INK_COLOR[1] : 255;
    data[i * 4 + 2] = isInk ? INK_COLOR[2] : 255;
    data[i * 4 + 3] = 255;
  }

  ctx.putImageData(frame, 0, 0);
  requestAnimationFrame(processFrame);
}

function bleed(output, w, h) {
  const copy = output.slice();
  const radius = Math.min(3 + Math.floor(stillCounter / 5), 18);

  for (let y = radius; y < h - radius; y += 2) {
    for (let x = radius; x < w - radius; x += 2) {
      const i = y * w + x;

      if (copy[i] === 0) {
        for (let dy = -radius; dy <= radius; dy += 2) {
          for (let dx = -radius; dx <= radius; dx += 2) {
            const d = dx * dx + dy * dy;

            if (d < radius * radius && Math.random() > 0.72) {
              const ni = (y + dy) * w + (x + dx);
              output[ni] = 0;
            }
          }
        }
      }
    }
  }
}

function isOverlapping(x, y, r) {
  for (const p of placed) {
    const dx = x - p.x;
    const dy = y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < r + p.r - 1) return true;
  }
  return false;
}

function findSpot(size) {
  const r = size / 2;

  for (let y = window.innerHeight - r; y > r; y -= Math.max(2, r * 0.25)) {
    for (let i = 0; i < 500; i++) {
      const x = r + Math.random() * (window.innerWidth - size);

      if (!isOverlapping(x, y, r)) {
        return { x, y };
      }
    }
  }

  return null;
}

function choosePattern() {
  const patterns = [
    {
      total: 1200,
      delay: 6,
      size: () => 6 + Math.random() * 18
    },
    {
      total: 900,
      delay: 8,
      size: () => {
        const c = Math.random();
        if (c < 0.65) return 8 + Math.random() * 20;
        if (c < 0.92) return 26 + Math.random() * 45;
        return 75 + Math.random() * 85;
      }
    },
    {
      total: 650,
      delay: 10,
      size: () => {
        const c = Math.random();
        if (c < 0.45) return 10 + Math.random() * 25;
        if (c < 0.82) return 35 + Math.random() * 65;
        return 90 + Math.random() * 120;
      }
    },
    {
      total: 1600,
      delay: 4,
      size: () => 4 + Math.random() * 12
    }
  ];

  return patterns[Math.floor(Math.random() * patterns.length)];
}

logo.onclick = () => {
  logo.style.pointerEvents = "none";

  const pattern = choosePattern();

  let count = 0;
  let hasHugeOne = Math.random() < 0.1;
  let hugePlaced = false;

  const drop = setInterval(() => {
    let size;

    if (hasHugeOne && !hugePlaced && count > 20) {
      size = Math.min(window.innerWidth, window.innerHeight) * (0.45 + Math.random() * 0.2);
      hugePlaced = true;
    } else {
      size = pattern.size();
    }

    const spot = findSpot(size);

    if (!spot) {
      clearInterval(drop);
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = "circle-img";

    img.style.width = size + "px";
    img.style.height = size + "px";
    img.style.left = (spot.x - size / 2) + "px";
    img.style.setProperty("--stopY", (spot.y - size / 2) + "px");
    img.style.animationDuration = 0.7 + Math.random() * 2 + "s";

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= pattern.total) {
      clearInterval(drop);
    }

  }, pattern.delay);
};
</script>

</body>
</html>
