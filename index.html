<script>
const logo = document.getElementById("logoText");
const IMG = "./bksscircle.png";
#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  cursor: pointer;
}
let placed = [];

function isOverlapping(x, y, r) {
  for (const p of placed) {
    const dx = x - p.x;
    const dy = y - p.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < r + p.r + 2) {
      return true;
    }
  }
  return false;
}

function findSpot(size) {
  const r = size / 2;

  for (let y = window.innerHeight - r; y > r; y -= r * 0.45) {
    for (let attempt = 0; attempt < 80; attempt++) {
      const x = r + Math.random() * (window.innerWidth - size);

      if (!isOverlapping(x, y, r)) {
        return { x, y };
      }
    }
  }

  return null;
}

logo.onclick = () => {
  logo.style.pointerEvents = "none";

  let count = 0;
  const total = 300;

  const drop = setInterval(() => {
    let size;

    if (count < 70) {
      size = 18 + Math.random() * 20;
    } else if (count < 170) {
      size = 35 + Math.random() * 35;
    } else {
      size = 65 + Math.random() * 70;
    }

    const spot = findSpot(size);

    if (!spot) {
      clearInterval(drop);
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = "circle-img";

    img.style.width = size + "px";
    img.style.height = size + "px";
    img.style.objectFit = "contain";

    img.style.left = (spot.x - size / 2) + "px";
    img.style.setProperty("--stopY", (spot.y - size / 2) + "px");

    img.style.animationDuration = 1.2 + Math.random() * 1.8 + "s";

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= total) {
      clearInterval(drop);
    }
  }, 30);
};
</script>
