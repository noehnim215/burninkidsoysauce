<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
}

#infoText {
  margin-top: 12px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 24px;
  line-height: 1.2;
  text-align: center;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 24px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

#changeBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: none;
  cursor: pointer;
  font-family: "ta-marugo-gf-03", sans-serif;
  border-bottom: 1px solid black;
  z-index: 999;
}

#flipBtn {
  position: fixed;
  left: 20px;
  bottom: 20px;
  display: none;
  cursor: pointer;
  font-family: "ta-marugo-gf-03", sans-serif;
  border-bottom: 1px solid black;
  z-index: 999;
}

.circle-img {
  position: fixed;
  top: -200px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 10;
}

.circle-pop {
  position: fixed;
  pointer-events: none;
  z-index: 10;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

#camCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: none;
  transform: scaleX(1);
  z-index: 1;
}

video {
  display: none;
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
  <div id="infoText"></div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<div id="flipBtn">Flip</div>
<div id="changeBtn">Change</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="camCanvas"></canvas>
<audio id="audio"></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const flipBtn = document.getElementById("flipBtn");
const changeBtn = document.getElementById("changeBtn");
const infoText = document.getElementById("infoText");

const video = document.getElementById("video");
const canvas = document.getElementById("camCanvas");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

const CAM_NOISE = 60;
const CAM_THRESHOLD = 110;
const CAM_BLUR = 0.5;
const CAM_BG_COLOR = [255,255,255];
const GREEN_COLOR = [81,255,14];
const BLACK_COLOR = [0,0,0];

let camRunning = false;
let INK_COLOR = BLACK_COLOR;
let isGreen = false;
let placed = [];

let currentStream = null;
let currentFacingMode = "user";
let locationText = "";

function setRandomLogoSize(){
  const chance = Math.random();
  let size;

  if (chance < 0.78) size = 6 + Math.random() * 114;
  else if (chance < 0.95) size = 120 + Math.random() * 180;
  else size = 300 + Math.random() * 212;

  logo.style.fontSize = size + "pt";
}
setRandomLogoSize();

function updateInfoText(){
  const now = new Date();

  const date = now.toLocaleDateString();
  const time = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  infoText.innerHTML = date + "" + time + "<div>" + (locationText ? " " + locationText : "");
}

updateInfoText();
setInterval(updateInfoText, 1000);

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`
      );
      const data = await res.json();

     locationText = data.display_name || [
  data.address.country,
  data.address.state,
  data.address.province,
  data.address.county,
  data.address.city || data.address.town || data.address.village,
  data.address.city_district,
  data.address.borough,
  data.address.suburb,
  data.address.neighbourhood,
  data.address.quarter,
  data.address.road,
  data.address.house_number,
  data.address.postcode
].filter(Boolean).join(" ");

      updateInfoText();
    } catch (e) {
      locationText = "";
    }
  });
}

changeBtn.onclick = () => {
  isGreen = !isGreen;
  INK_COLOR = isGreen ? GREEN_COLOR : BLACK_COLOR;
};

camBtn.onclick = () => {
  startCamera(currentFacingMode);
};

flipBtn.onclick = () => {
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  startCamera(currentFacingMode);
};

async function startCamera(facingMode) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });

  currentStream = stream;
  video.srcObject = stream;

  canvas.style.display = "block";
  canvas.style.filter = "blur(" + CAM_BLUR + "px)";
  canvas.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)";

  changeBtn.style.display = "block";
  flipBtn.style.display = "block";

  video.onloadedmetadata = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    camRunning = true;
    processFrame();
  };
}

window.addEventListener("resize", () => {
  if (camRunning) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});

function drawVideoCover() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const cw = canvas.width;
  const ch = canvas.height;

  const scale = Math.max(cw / vw, ch / vh);
  const nw = vw * scale;
  const nh = vh * scale;
  const dx = (cw - nw) / 2;
  const dy = (ch - nh) / 2;

  ctx.drawImage(video, dx, dy, nw, nh);
}

function processFrame(){
  if(!camRunning) return;

  drawVideoCover();

  let frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  let data = frame.data;

  for(let i=0;i<data.length;i+=4){
    let gray = (data[i]+data[i+1]+data[i+2])/3;

    gray += (Math.random()-0.5) * CAM_NOISE;

    let v = gray < CAM_THRESHOLD ? 0 : 255;

    if (v === 0) {
      data[i] = INK_COLOR[0];
      data[i+1] = INK_COLOR[1];
      data[i+2] = INK_COLOR[2];
    } else {
      data[i] = CAM_BG_COLOR[0];
      data[i+1] = CAM_BG_COLOR[1];
      data[i+2] = CAM_BG_COLOR[2];
    }
  }

  ctx.putImageData(frame,0,0);
  requestAnimationFrame(processFrame);
}

songBtn.onclick = () => {
  document.getElementById("intro").style.display = "none";

  const wrap = document.createElement("div");

  wrap.style.position = "fixed";
  wrap.style.inset = "0";
  wrap.style.display = "flex";
  wrap.style.alignItems = "center";
  wrap.style.justifyContent = "center";
  wrap.style.gap = "70px";
  wrap.style.fontFamily = '"ta-marugo-gf-03", sans-serif';
  wrap.style.zIndex = "100";

  wrap.innerHTML = `
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>

    <img src="./again1.png" style="
      width:360px;
      height:360px;
      object-fit:cover;
      animation: spin 20s linear infinite;
      position:relative;
      z-index:0;
    ">

    <div id="songList" style="
      font-size:28px;
      line-height:1.6;
      position:relative;
      z-index:2;
    ">
      <div data="2000.mp3">2000</div>
      <div data="wiimydadgotmeforchristmas.mp3">wiimydadgotmeforchristmas</div>
      <div data="ps2iplayedwithmybrother.mp3">ps2iplayedwithmybrother</div>
      <div data="girl.mp3">girl</div>
      <div data="2ear.mp3">2ear</div>
      <div data="eolssu.mp3">eolssu</div>
      <div data="dance.mp3">dance</div>
      <div data="how sweet it is.mp3">how sweet it is</div>
      <div data="get up.mp3">get up</div>
      <div data="sierra.mp3">sierra</div>
      <div data="friends.mp3">friends</div>
      <div data="emptyyourmind.mp3">emptyyourmind</div>
      <div data="circle.mp3">circle</div>
    </div>
  `;

  document.body.appendChild(wrap);

  const items = wrap.querySelectorAll("#songList div");

  items.forEach(el=>{
    el.style.cursor = "pointer";

    el.onclick = () => {
      audio.src = "./" + el.getAttribute("data");
      audio.play();

      items.forEach(i=>i.style.color="black");
      el.style.color="#51ff0e";
    };
  });
};

function isOverlap(x,y,r){
  for(let p of placed){
    let dx=x-p.x;
    let dy=y-p.y;
    if(Math.sqrt(dx*dx+dy*dy) < r+p.r) return true;
  }
  return false;
}

function findSpot(size){
  let r=size/2;

  for(let y=window.innerHeight-r;y>r;y-=Math.max(2,r*0.25)){
    for(let i=0;i<700;i++){
      let x=r+Math.random()*(window.innerWidth-size);
      if(!isOverlap(x,y,r)) return {x,y};
    }
  }
  return null;
}

let circleTimer = null;

logo.onclick = () => {
  if (circleTimer) {
    clearInterval(circleTimer);
    circleTimer = null;
  }

  placed = [];

  document.querySelectorAll(".circle-img, .circle-pop").forEach(el => el.remove());

  let count = 0;

  const roll = Math.random();
  let pattern;

  if (roll < 0.25) pattern = "tinyFull";
  else if (roll < 0.45) pattern = "mediumFull";
  else if (roll < 0.70) pattern = "mixed";
  else if (roll < 0.90) pattern = "smallHuge";
  else pattern = "random";

  const motion = Math.random() < 0.6 ? "fall" : "pop";

  const hasHuge = Math.random() < 1 / 15;
  const hugeAt = 12;

  function getSize() {
    if (hasHuge && count === hugeAt) {
      return Math.min(window.innerWidth, window.innerHeight) * 0.72;
    }

    if (pattern === "tinyFull") {
      return 4 + Math.random() * 12;
    }

    if (pattern === "mediumFull") {
      return 24 + Math.random() * 48;
    }

    if (pattern === "mixed") {
      const c = Math.random();
      if (c < 0.65) return 6 + Math.random() * 24;
      if (c < 0.93) return 30 + Math.random() * 70;
      return 90 + Math.random() * 90;
    }

    if (pattern === "smallHuge") {
      const c = Math.random();
      if (c < 0.92) return 5 + Math.random() * 18;
      return 70 + Math.random() * 90;
    }

    const c = Math.random();
    if (c < 0.55) return 6 + Math.random() * 24;
    if (c < 0.85) return 28 + Math.random() * 65;
    return 70 + Math.random() * 120;
  }

  function getTotal() {
    if (pattern === "tinyFull") return 2400;
    if (pattern === "mediumFull") return 900;
    if (pattern === "mixed") return 1300;
    if (pattern === "smallHuge") return 1800;
    return 1200;
  }

  const total = getTotal();

  circleTimer = setInterval(() => {
    const size = getSize();

    let spot;
    const isHuge = hasHuge && count === hugeAt;

    if (isHuge) {
      spot = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
      };
    } else {
      spot = findSpot(size);
    }

    if (!spot) {
      clearInterval(circleTimer);
      circleTimer = null;
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = motion === "fall" ? "circle-img" : "circle-pop";

    img.style.width = size + "px";
    img.style.height = size + "px";
    img.style.left = (spot.x - size / 2) + "px";

    if (motion === "fall") {
      img.style.setProperty("--stopY", (spot.y - size / 2) + "px");
      img.style.animationDuration = 0.5 + Math.random() * 1.8 + "s";
    } else {
      img.style.top = (spot.y - size / 2) + "px";
    }

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= total) {
      clearInterval(circleTimer);
      circleTimer = null;
    }
  }, pattern === "tinyFull" ? 3 : 9);
};
</script>

</body>
</html>
