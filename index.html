<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<!-- Adobe Font -->
<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

/* 가운데 텍스트 */
#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  font-size: 78px;
  cursor: pointer;
  transition: transform 0.2s;
}

#logoText:hover {
  transform: scale(1.05);
}

/* 떨어지는 이미지 */
.falling-img {
  position: fixed;
  top: -120px;
  width: 80px;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(120vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
</div>

<script>
const logo = document.getElementById("logoText");

// 👇 여기 네 이미지 경로 (왼쪽 폴더에 맞게)
const IMG = "bksscircle.png";

logo.onclick = () => {

  // 이미지 우수수 떨어짐
  for (let i = 0; i < 50; i++) {
    const img = document.createElement("img");
    img.src = IMG;
    img.className = "falling-img";

    img.style.left = Math.random() * 100 + "vw";
    img.style.width = 40 + Math.random() * 80 + "px";
    img.style.animationDuration = 1 + Math.random() * 2.5 + "s";
    img.style.animationDelay = Math.random() * 0.5 + "s";

    document.body.appendChild(img);

    setTimeout(() => img.remove(), 5000);
  }

  // 화면 사라짐
  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
  }, 1500);
};
</script>

</body>
</html>
