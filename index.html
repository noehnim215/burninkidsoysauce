<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<!-- FONT -->
<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0];
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
var a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  cursor: pointer;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
}

.controls span {
  margin: 0 10px;
  cursor: pointer;
  border-bottom: 1px solid black;
}
</style>

</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
    <span id="greenBtn" style="display:none;">#51ff0e</span>
    <span id="blackBtn" style="display:none;">Black</span>
  </div>
</div>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const greenBtn = document.getElementById("greenBtn");
const blackBtn = document.getElementById("blackBtn");

/* 로고 랜덤 사이즈 */
function setRandomLogoSize() {
  const chance = Math.random();
  let size;

  if (chance < 0.8) size = 6 + Math.random() * 120;
  else if (chance < 0.95) size = 120 + Math.random() * 150;
  else size = 300 + Math.random() * 200;

  logo.style.fontSize = size + "pt";
}
setRandomLogoSize();

/* 버튼 */
camBtn.onclick = () => {
  greenBtn.style.display = "inline";
  blackBtn.style.display = "inline";
};
</script>

</body>
</html>
