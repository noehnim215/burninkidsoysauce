<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)
})(document);
</script>

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#logoText {
  font-family: "ta-marugo-gf-03", sans-serif;
  font-weight: 400;
  font-size: 72pt; /* 👈 여기 72pt */
  line-height: 1;
  cursor: pointer;
  color: black;
}

.controls {
  margin-top: 20px;
  font-family: "ta-marugo-gf-03", sans-serif;
  font-size: 16px;
}

.controls span {
  margin: 0 12px;
  cursor: pointer;
  border-bottom: 1px solid black;
}

.circle-img {
  position: fixed;
  top: -160px;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: ease-in;
  animation-fill-mode: forwards;
}

@keyframes fall {
  to {
    top: var(--stopY);
  }
}

video {
  position: fixed;
  inset: 0;
  object-fit: cover;
  z-index: -1;
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>

  <div class="controls">
    <span id="camBtn">Cam</span>
    <span id="songBtn">Song</span>
  </div>
</div>

<video id="video" autoplay muted playsinline></video>
<audio id="audio" loop></audio>

<script>
const logo = document.getElementById("logoText");
const camBtn = document.getElementById("camBtn");
const songBtn = document.getElementById("songBtn");
const video = document.getElementById("video");
const audio = document.getElementById("audio");

const IMG = "./bksscircle.png";

let placed = [];

/* 카메라 */
camBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
};

/* 음악 */
songBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "audio/*";

  input.onchange = (e) => {
    const file = e.target.files[0];
    audio.src = URL.createObjectURL(file);
    audio.play();
  };

  input.click();
};

/* 겹침 체크 */
function isOverlapping(x, y, r) {
  for (const p of placed) {
    const dx = x - p.x;
    const dy = y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < r + p.r + 2) return true;
  }
  return false;
}

/* 자리 찾기 */
function findSpot(size) {
  const r = size / 2;

  for (let y = window.innerHeight - r; y > r; y -= r * 0.5) {
    for (let i = 0; i < 100; i++) {
      const x = r + Math.random() * (window.innerWidth - size);

      if (!isOverlapping(x, y, r)) {
        return { x, y };
      }
    }
  }
  return null;
}

/* 클릭 → 원 쌓임 */
logo.onclick = () => {
  logo.style.pointerEvents = "none";

  let count = 0;
  const total = 300;

  const drop = setInterval(() => {

    let size;

    if (count < 80) {
      size = 15 + Math.random() * 20;
    } else if (count < 180) {
      size = 30 + Math.random() * 40;
    } else {
      size = 60 + Math.random() * 70;
    }

    const spot = findSpot(size);

    if (!spot) {
      clearInterval(drop);
      return;
    }

    const img = document.createElement("img");
    img.src = IMG;
    img.className = "circle-img";

    img.style.width = size + "px";
    img.style.height = size + "px";

    img.style.left = (spot.x - size / 2) + "px";
    img.style.setProperty("--stopY", (spot.y - size / 2) + "px");

    img.style.animationDuration = 1 + Math.random() * 2 + "s";

    document.body.appendChild(img);

    placed.push({
      x: spot.x,
      y: spot.y,
      r: size / 2
    });

    count++;

    if (count >= total) {
      clearInterval(drop);
    }

  }, 25);
};
</script>

</body>
</html>
