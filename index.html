<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>burninkidsoysauce</title>

<!-- 폰트 -->
<script>
(function(d) {
var config = {
kitId: 'wno3het',
scriptTimeout: 3000,
async: true
},
h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),
tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;
h.className+=" wf-loading";
tk.src='https://use.typekit.net/'+config.kitId+'.js';
tk.async=true;
tk.onload=tk.onreadystatechange=function(){
a=this.readyState;
if(f||a&&a!="complete"&&a!="loaded")return;
f=true;clearTimeout(t);
try{Typekit.load(config)}catch(e){}
};
s.parentNode.insertBefore(tk,s)

<style>
body {
  margin: 0;
  background: white;
  overflow: hidden;
  font-family: "ta-marugo-gf-01", sans-serif;
}

#intro {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logoText {
  font-size: 40px;
  font-weight: 600;
  cursor: pointer;
}

.falling-img {
  position: fixed;
  top: -120px;
  width: 80px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(120vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div id="intro">
  <div id="logoText">burninkidsoysauce</div>
</div>

<script>
const logo = document.getElementById("logoText");
const IMG = "images/BeforeRidingtheBike.png";

logo.onclick = () => {
  for (let i = 0; i < 40; i++) {
    const img = document.createElement("img");
    img.src = IMG;
    img.className = "falling-img";

    img.style.left = Math.random() * 100 + "vw";
    img.style.width = 50 + Math.random() * 60 + "px";
    img.style.animationDuration = 1 + Math.random() * 2 + "s";

    document.body.appendChild(img);

    setTimeout(() => img.remove(), 4000);
  }

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
  }, 1500);
};
</script>

</body>
</html>
